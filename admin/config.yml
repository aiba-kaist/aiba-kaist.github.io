backend:
  name: github
  repo: aiba-kaist/aiba-kaist.github.io
  branch: main
  base_url: https://api.netlify.com
  auth_endpoint: auth

# 로컬 테스트용 (npm run cms)
# local_backend: true

media_folder: "assets/img"
public_folder: "/assets/img"

# 로고 및 사이트 정보
site_url: https://aiba-kaist.github.io
logo_url: https://aiba-kaist.github.io/assets/img/logo.png

collections:
  # ============================================
  # Members (팀원 관리)
  # ============================================
  - name: "members"
    label: "👥 Members"
    label_singular: "Member"
    folder: "_data/members"
    create: true
    slug: "{{slug}}"
    extension: "yml"
    format: "yaml"
    fields:
      - { name: "name_en", label: "Name (English)", widget: "string" }
      - { name: "name_ko", label: "Name (Korean)", widget: "string", required: false }
      - { name: "role", label: "Role", widget: "select", options: ["Faculty", "PhD", "MS", "Undergrad", "Alumni"] }
      - { name: "position", label: "Position", widget: "string", required: false, hint: "예: Associate Professor" }
      - { name: "affiliation", label: "Affiliation", widget: "string", required: false }
      - { name: "email", label: "Email", widget: "string", required: false }
      - { name: "website", label: "Website", widget: "string", required: false }
      - { name: "photo", label: "Photo", widget: "image", required: false, media_folder: "/assets/img/members" }
      - { name: "research_area", label: "Research Area", widget: "string", required: false }
      - { name: "bio", label: "Bio", widget: "text", required: false }
      - { name: "graduation_info", label: "Graduation Info (Alumni only)", widget: "string", required: false, hint: "예: M.S. 2025 · PwC" }
      - { name: "order", label: "Display Order", widget: "number", default: 100 }

  # ============================================
  # Publications (논문 관리)
  # ============================================
  - name: "publications"
    label: "📚 Publications"
    label_singular: "Publication"
    folder: "_data/publications"
    create: true
    slug: "{{year}}-{{slug}}"
    extension: "yml"
    format: "yaml"
    fields:
      - { name: "title", label: "Title", widget: "string" }
      - { name: "authors", label: "Authors", widget: "string", hint: "예: Lee, Suhyeon and Yu, Youngjun and Shin, Donghyuk" }
      - { name: "type", label: "Type", widget: "select", options: ["journal", "conference"] }
      - { name: "venue", label: "Venue", widget: "string", hint: "저널명 또는 학회명" }
      - { name: "year", label: "Year", widget: "number" }
      - { name: "abbr", label: "Abbreviation", widget: "string", hint: "예: MISQ, CIKM, WITS" }
      - { name: "volume", label: "Volume", widget: "string", required: false }
      - { name: "number", label: "Number", widget: "string", required: false }
      - { name: "pages", label: "Pages", widget: "string", required: false }
      - { name: "award", label: "Award", widget: "string", required: false }
      - { name: "selected", label: "Selected (Featured)", widget: "boolean", default: false }
      - { name: "pdf", label: "PDF Link", widget: "string", required: false }
      - { name: "code", label: "Code Link", widget: "string", required: false }
      - { name: "abstract", label: "Abstract", widget: "text", required: false }

  # ============================================
  # Teaching (강의 관리)
  # ============================================
  - name: "teaching"
    label: "🎓 Teaching"
    label_singular: "Course"
    folder: "_data/teaching"
    create: true
    slug: "{{slug}}"
    extension: "yml"
    format: "yaml"
    fields:
      - { name: "course_code", label: "Course Code", widget: "string", hint: "예: MGT 562" }
      - { name: "course_name", label: "Course Name", widget: "string" }
      - { name: "description", label: "Description", widget: "text", required: false }
      - { name: "topics", label: "Topics", widget: "string", required: false }
      - { name: "semester", label: "Semester", widget: "string", required: false, hint: "예: 2024 Spring" }
      - { name: "is_current", label: "Current Course", widget: "boolean", default: true }
      - { name: "order", label: "Display Order", widget: "number", default: 100 }

  # ============================================
  # Industry (파트너 관리)
  # ============================================
  - name: "industry"
    label: "🏢 Industry Partners"
    label_singular: "Partner"
    folder: "_data/industry"
    create: true
    slug: "{{slug}}"
    extension: "yml"
    format: "yaml"
    fields:
      - { name: "name", label: "Name", widget: "string" }
      - { name: "type", label: "Type", widget: "select", options: ["Collaborator", "Funding"] }
      - { name: "logo", label: "Logo", widget: "image", required: false, media_folder: "/assets/img/partners" }
      - { name: "description", label: "Description", widget: "string", required: false }
      - { name: "website", label: "Website", widget: "string", required: false }
      - { name: "order", label: "Display Order", widget: "number", default: 100 }

  # ============================================
  # Gallery (갤러리 관리)
  # ============================================
  - name: "gallery"
    label: "🖼️ Gallery"
    label_singular: "Photo"
    folder: "_data/gallery"
    create: true
    slug: "{{year}}-{{month}}-{{slug}}"
    extension: "yml"
    format: "yaml"
    fields:
      - { name: "image", label: "Image", widget: "image", media_folder: "/assets/img/gallery" }
      - { name: "caption", label: "Caption", widget: "string" }
      - { name: "category", label: "Category", widget: "select", options: ["Conferences", "Lab Life"] }
      - { name: "date", label: "Date", widget: "datetime", required: false }
      - { name: "order", label: "Display Order", widget: "number", default: 100 }

  # ============================================
  # News (뉴스/공지사항 관리)
  # ============================================
  - name: "news"
    label: "📢 News"
    label_singular: "Announcement"
    folder: "_news"
    create: true
    slug: "{{slug}}"
    extension: "md"
    fields:
      - { name: "layout", label: "Layout", widget: "hidden", default: "post" }
      - { name: "date", label: "Date", widget: "datetime" }
      - { name: "inline", label: "Inline", widget: "hidden", default: true }
      - { name: "related_posts", label: "Related Posts", widget: "hidden", default: false }
      - { name: "body", label: "Content", widget: "markdown" }

  # ============================================
  # Site Settings (사이트 설정)
  # ============================================
  - name: "settings"
    label: "⚙️ Settings"
    files:
      - name: "about"
        label: "About Page"
        file: "_pages/about.md"
        fields:
          - { name: "layout", label: "Layout", widget: "hidden", default: "about" }
          - { name: "title", label: "Title", widget: "hidden", default: "about" }
          - { name: "permalink", label: "Permalink", widget: "hidden", default: "/" }
          - { name: "subtitle", label: "Subtitle", widget: "string" }
          - { name: "profile", label: "Profile", widget: "hidden", default: false }
          - { name: "selected_papers", label: "Show Selected Papers", widget: "boolean", default: false }
          - { name: "social", label: "Show Social Links", widget: "boolean", default: false }
          - { name: "body", label: "Content", widget: "markdown" }
